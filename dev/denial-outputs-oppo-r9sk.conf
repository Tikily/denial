# Denial output configuration for the OPPO R9s/k (msm8953) mobile test host.
#
# The panel is a fixed portrait 1080x1920 DSI display on connector DSI-1 with
# no EDID. Denial selects its only native mode (1080x1920 at 60 Hz) when the
# connector is not pinned. Placement is pinned for a stable primary reference.
#
# Mobile shell: the R9s/k uses Denial's mobile status/navigation bars, so the
# desktop system bar is hidden. This is the same spec as --system-bar hidden.
system_bar=hidden

# Logical pixels between a maximized window and every output edge the bar
# does not occupy (defaults to 10 when omitted).
maximize_padding=10

# Output settings managed by Denial output control.
primary=DSI-1
DSI-1=0,0
mode=DSI-1,1080,1920,60000
scale=DSI-1,1